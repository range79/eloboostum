spring.application.name=eloboostum
api.prefix=/api/v1
jwt.secret=${JWT_SECRET}
jwt.duration=${JWT_DURATION}
app.url=${APP_URL}




# Db connections
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}


# Default limits
resilience4j.ratelimiter.instances.defaults.limit-for-period=5
resilience4j.ratelimiter.instances.defaults.limit-refresh-period=1m

# Only override different endpoints
resilience4j.ratelimiter.instances.register.limit-for-period=5
resilience4j.ratelimiter.instances.register.limit-refresh-period=20m

resilience4j.ratelimiter.instances.resetPassword.limit-for-period=4
resilience4j.ratelimiter.instances.resetPassword.limit-refresh-period=10m

resilience4j.ratelimiter.instances.forgotPasswordRequest.limit-for-period=4
resilience4j.ratelimiter.instances.forgotPasswordRequest.limit-refresh-period=10m
#superadmin
resilience4j.ratelimiter.instances.give-moderator.limit-for-period=4
resilience4j.ratelimiter.instances.give-moderator.limit-refresh-period=1m
resilience4j.ratelimiter.instances.remove-moderator.limit-for-period=4
resilience4j.ratelimiter.instances.remove-moderator.limit-refresh-period=1m



# Mail sending
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USER}
spring.mail.password=${MAIL_PASS}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
